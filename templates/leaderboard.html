{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm rounded-4 animate__animated animate__fadeInUp">
  <div class="card-body">
    <h4 class="fw-bold mb-3"><i class="bi bi-bar-chart-line-fill text-warning me-2"></i>Leaderboard</h4>
    <p class="text-muted small mb-4">Top students by points</p>

    <div class="table-responsive">
      <table class="table table-hover align-middle text-center">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Student</th>
            <th>Points</th>
            <th>Level</th>
          </tr>
        </thead>
        <tbody>
          {% for sp in tops %}
            <tr class="animate__animated animate__fadeInUp" style="animation-delay: {{ loop.index0 * 0.05 }}s;">
              <td><span class="badge bg-primary">{{ loop.index }}</span></td>
              <td class="text-start ps-4"><i class="bi bi-person-circle me-2 text-primary"></i> {{ sp.username }}</td>
              <td><span class="badge bg-success">{{ sp.points }}</span></td>
              <td><span class="badge bg-info text-dark">Level {{ sp.level }}</span></td>
            </tr>
          {% else %}
            <tr><td colspan="4" class="text-muted">No student records yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="text-center mt-3">
      <a class="btn btn-outline-primary" href="{{ url_for('student_dashboard') }}"><i class="bi bi-house-door-fill me-1"></i>Back</a>
    </div>
  </div>
</div>
{% endblock %}
