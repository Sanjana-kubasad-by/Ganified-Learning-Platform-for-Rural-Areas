{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm rounded-4 animate__animated animate__fadeInUp">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-3">Welcome back</h4>
        <p class="text-muted text-center small mb-4">Login to continue learning</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" required class="form-control" placeholder="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" required class="form-control" placeholder="password">
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg">Login</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <small class="text-muted">Don't have account? <a href="{{ url_for('register') }}">Sign up</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
